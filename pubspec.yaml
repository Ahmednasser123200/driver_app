name: driver_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  dio: ^5.11.1
  injectable: ^3.0.0
  equatable: ^2.1.0
  get_it: ^9.2.1
  flutter_bloc: ^9.1.1
  flutter_screenutil_plus: ^1.6.0
  persistent_bottom_nav_bar_v2: ^6.4.0
  flutter_secure_storage: ^11.2.0
  google_fonts: ^8.2.1
  pinput: ^6.0.2
  shared_preferences: ^2.5.5
  permission_handler: ^13.0.2
  geolocator: ^14.0.3
  google_maps_flutter: ^2.18.0
  cached_network_image: ^4.0.0
  geocoding: ^5.0.0
  flutter_dotenv: ^6.0.1
  collection: ^1.19.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  lottie: ^3.6.1
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  retrofit_generator: ^10.2.9
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  injectable_generator: ^3.1.3
  bloc_test: ^10.0.0
  mockito: ^5.6.4
  mocktail: ^1.0.5
  test: ^1.31.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/lottie/
    - assets/splash/
    - assets/images/

  generate: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash/splash.png

  android_12:
    color: "#FFFFFF"
    image: assets/splash/splash.png

  ios: true
  android: true
